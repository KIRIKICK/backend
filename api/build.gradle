plugins {
	id 'java'
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
	id 'com.github.spotbugs'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

spotbugs {
	toolVersion = '4.10.5'
	runOnCheck = false
	ignoreFailures = false
}

def spotbugsAux = configurations.dependencyScope('spotbugsAux')
def spotbugsAuxClasspath = configurations.resolvable('spotbugsAuxClasspath') {
	extendsFrom(spotbugsAux.get())
}

tasks.named('spotbugsMain') {
	auxClassPaths.from(spotbugsAuxClasspath)
	reports {
		html.required = true
		xml.required = true
	}
}

dependencies {
	spotbugs "com.github.spotbugs:spotbugs:${project.spotbugs.toolVersion.get()}"
	spotbugs 'org.apache.commons:commons-lang3:3.21.0'
	add('spotbugsAux', 'org.jetbrains:annotations:17.0.0')

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'com.querydsl:querydsl-jpa::jakarta'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.session:spring-session-data-redis'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.10.0'
    compileOnly "com.github.spotbugs:spotbugs-annotations:${project.spotbugs.toolVersion.get()}"
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'com.querydsl:querydsl-apt::jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation project(':test-support')
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testAnnotationProcessor 'com.querydsl:querydsl-apt::jakarta'
	testAnnotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	testAnnotationProcessor 'jakarta.persistence:jakarta.persistence-api'
}

sourceSets {
	test.java.srcDir rootProject.file('architecture-tests/src/regressionTest/java')
}

tasks.named('test') {
	filter {
		excludeTestsMatching 'org.kirikick.api.support.PostgresInstantTimeZoneTest'
	}
}

def postgresInstantTimeZoneTest = tasks.register('postgresInstantTimeZoneTest', Test) {
	description = 'Verifies Instant persistence on a Flyway schema with different JVM and PostgreSQL time zones.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	systemProperty 'user.timezone', 'Asia/Seoul'
	filter {
		includeTestsMatching 'org.kirikick.api.support.PostgresInstantTimeZoneTest'
	}
}

tasks.named('check') {
	dependsOn postgresInstantTimeZoneTest
}

tasks.named('bootRun') {
	workingDir = rootProject.projectDir
}
