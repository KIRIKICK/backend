spring:
  application:
    name: api
  profiles:
    default: local
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
  docker:
    compose:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    clean-disabled: true
  session:
    timeout: 10m
    redis:
      repository-type: default
      configure-action: none
      namespace: ${auth.session-redis-namespace}
auth:
  redis-namespace: ${REDIS_NAMESPACE}:auth
  session-redis-namespace: ${REDIS_NAMESPACE}:spring:session
  fe-origin: ${AUTH_FE_ORIGIN}
  secure-cookies: true
  cross-site-cookies: ${AUTH_CROSS_SITE_COOKIES:false}
  jwt:
    issuer: ${AUTH_JWT_ISSUER}
    audience: ${AUTH_JWT_AUDIENCE}
    private-key-location: ${AUTH_JWT_PRIVATE_KEY_LOCATION}
    public-key-location: ${AUTH_JWT_PUBLIC_KEY_LOCATION}
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    issuer-uri: https://kauth.kakao.com
    authorization-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  health:
    redis:
      enabled: true
